name: Aternos Keep Alive

on:
  workflow_dispatch: {}   # manual "Run workflow" button
  schedule:
    - cron: '0 */5 * * *' # tries every 5h; GitHub may delay this, don't rely on it alone

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # just under the 6h (360 min) hard cap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Run bot
        env:
          MC_HOST: ${{ secrets.MC_HOST }}
          MC_PORT: ${{ secrets.MC_PORT }}
          MC_USERNAME: '24/7bot'
          MC_VERSION: '1.21.11'
        run: timeout 20700 node bot.js || true  # 345 min, leaves buffer before job timeout
